data:
  dataset_dir: instance/Data
  split: train
  eval_split: test
  train_ratio: 0.8
  val_ratio: 0.0
  test_ratio: 0.2
  split_seed: 1234

model:
  node_feature_dim: 6
  embedding_dim: 128
  encoder_layer_num: 6
  qkv_dim: 16
  head_num: 8
  logit_clipping: 10.0
  ff_hidden_dim: 512
  max_pomo_size: 8

optimizer:
  lr: 0.0001
  weight_decay: 0.000001

train:
  epochs: 1
  batch_size: 4
  grad_clip: 1.0
  penalty_reward: -1000000.0
  validate_every: 1
  checkpoint_every: 1
  max_batches_per_epoch:

decode:
  decode_type: greedy
  num_candidates: 8
  sample_max_rollouts: 32

solver:
  gurobi_time_limit:
  gurobi_threads:
  output_flag: 0

runtime:
  seed: 1234
  device: cpu
  output_dir: outputs/cvtsp_mvp
  checkpoint_path: ""
  log_level: INFO
